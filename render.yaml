services:
  # Backend Web Service
  - type: web
    name: game-backend
    env: python
    buildCommand: ./build.sh
    startCommand: gunicorn backend.game_recommender.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: game-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: 3.11.9

  # Frontend Static Site
  - type: static_site
    name: game-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishDir: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: game-backend
          property: url
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: game-backend
          property: url

databases:
  - name: game-db
    plan: free # Note: Expires after 90 days on Render
