services:
  # Backend Web Service
  - type: web
    name: game-backend
    env: python
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: gunicorn game_recommender.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: game-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: 3.11.9

staticSites:
  # Frontend Static Site
  - name: game-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishDir: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: game-backend
          property: url
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: game-db
    plan: free
