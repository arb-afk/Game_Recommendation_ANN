services:
  # Backend Web Service
  - type: web
    name: game-backend
    env: python
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: gunicorn game_recommender.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: game-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: 3.11.9

  # Frontend Web Service (Workaround for Static Site)
  # using 'npx serve' to host the static files as a Node service
  - type: web
    name: game-frontend
    env: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npx serve -s dist -p $PORT --single
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: game-backend
          property: url

databases:
  - name: game-db
    plan: free